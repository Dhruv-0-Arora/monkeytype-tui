[package]
name = "monkeytype-tui"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
description = "A terminal client for monkeytype"
license = "GPL-3.0-or-later"

[dependencies]
ratatui = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = { version = "0.8", features = ["small_rng"] }
toml = "0.8"
directories = "5"
reqwest = { version = "0.12", default-features = false, features = [
    "blocking",
    "json",
    "rustls-tls",
] }
keyring = { version = "3", features = [
    "apple-native",
    "windows-native",
    "sync-secret-service",
] }
open = "5"
sha1 = "0.10"
thiserror = "2"

[dev-dependencies]
pretty_assertions = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
wiremock = "0.6"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
