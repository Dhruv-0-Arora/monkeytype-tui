[package]
name = "monkeytype-tui"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "A terminal client for monkeytype"
license = "GPL-3.0-or-later"

[dependencies]
ratatui = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = { version = "0.8", features = ["small_rng"] }

[dev-dependencies]
pretty_assertions = "1"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
